[pytest]
# Generated labs and their scratch installs live under `output/`, and a bare
# `pytest` used to walk into them: a vendored `colorama` there ships its own
# test files, so collection failed with 8 errors before a single test of this
# repo ran. The suite lives in exactly one place, so say so.
testpaths = tests
norecursedirs = output .git .pydeps __pycache__ templates
markers =
    requires_twofish: test requires a local Packet Tracer Twofish bridge and real .pkt decode/edit runtime
